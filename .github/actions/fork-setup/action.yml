name: Fork CI setup
description: >-
  Node from .nvmrc, pnpm 9.15.4, the pnpm store restored from cache, a
  frozen-lockfile install and, when asked, the runner's pinned Rust toolchain.
  Check the repository out before using it.

inputs:
  rust:
    description: >-
      Install the toolchain pinned in packages/paperclip-runner/rust-toolchain.toml
      and select it for every cargo call in the job.
    default: "false"
  save-pnpm-store:
    description: Save the pnpm store when the exact cache key missed. One job per run is enough.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 9.15.4

    - name: Locate pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store
      id: restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: fork-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: fork-pnpm-${{ runner.os }}-${{ runner.arch }}-

    # Frozen on purpose: after an upstream merge and a rebrand run, a lockfile
    # that no longer matches the manifests should fail here, not be resolved.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Save pnpm store
      if: inputs.save-pnpm-store == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ steps.restore.outputs.cache-primary-key }}

    # rust-toolchain.toml lives in packages/paperclip-runner, and rustup only
    # honours it for cargo calls made from inside that folder. Install it up
    # front (newer rustup no longer installs a toolchain on first use) and
    # export RUSTUP_TOOLCHAIN so any cargo call in the job, from any working
    # directory, uses the pin rather than the image's own stable Rust.
    - name: Install the runner's pinned Rust toolchain
      if: inputs.rust == 'true'
      shell: bash
      working-directory: packages/paperclip-runner
      run: |
        rustup toolchain install || rustup show
        toolchain="$(rustup show active-toolchain | awk '{print $1}')"
        echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
        echo "Runner Rust toolchain: $toolchain"
