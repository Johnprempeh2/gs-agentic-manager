# Everything a customer downloads for a GSAM release, attached to its GitHub
# release so the website can link to releases/latest/download/<file>:
#
#   runner             paperclip-runnerd for Windows x64 (MSVC), macOS arm64
#                      and macOS x64 (cross-built on the Apple silicon runner),
#                      which installs download instead of compiling Rust
#   mac-installer      GSAM-Installer.dmg: the universal GSAM.app in a branded
#                      disk image (packaging/macos/build.sh); plus Light and
#                      Dark Mode screenshots of the mounted window
#   windows-installer  GSAM-Setup.exe (packaging/windows/build.ps1);
#                      plus screenshots of the wizard pages
#   publish            on a live-* tag only: SHA256SUMS over all of them, and
#                      every file on that tag's release (made if missing). The
#                      release is marked latest only when it is the newest
#                      live-* tag, so back-filling an older tag never moves
#                      releases/latest.
#
# The installers build the hub address in from the repository variable
# GSAM_HUB_URL (Settings, Secrets and variables, Actions, Variables). Unset,
# they still build, with a warning: such an installer cannot activate a licence.
#
# Pull requests that touch any of it build everything and keep it as workflow
# artifacts; nothing is published. A run by hand with a tag builds that tag and
# publishes it (back-fill for a tag made before this workflow). Plan:
# doc/plans/2026-11-25-gsam-for-windows.md (W3, W4). Publish alone gets
# contents: write.
#
# Mac signing (packaging/macos/README.md, "Signing"). When these repository
# secrets exist, a tag build or a run by hand signs GSAM.app, the disk image
# and the two Mac runner binaries with Greatstone's Developer ID, and Apple
# notarises the disk image. Without them everything is ad hoc signed as before.
# Pull requests never see the secrets and never sign.
#   MACOS_CERT_P12, MACOS_CERT_PASSWORD      the Developer ID Application certificate
#   MACOS_NOTARY_KEY_P8 (base64), MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER_ID
#                                            the App Store Connect API key
#
# Windows signing (packaging/windows/README.md, "Signing"). When these exist, a
# tag build or a run by hand signs GSAM-Setup.exe, its uninstaller and the
# Windows runner binary through Azure Artifact Signing. Without them they are
# unsigned as before. Pull requests never see the secrets; they sign the
# installer with a throwaway certificate, only to prove the plumbing.
#   secrets    AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#   variables  AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE

name: Release assets

on:
  push:
    tags: ["live-*"]
  pull_request:
    paths:
      - ".github/workflows/release-assets.yml"
      - "packages/paperclip-runner/runner/**"
      - "packages/paperclip-runner/rust-toolchain.toml"
      - "packaging/**"
      - "scripts/fetch-runner-binary.mjs"
      - "scripts/release/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "A live-* tag to build and publish (empty: build this branch, publish nothing)"
        required: false

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.pull_request.number || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The ref to build: the tag being published, else the pushed or pull request ref.
  BUILD_REF: ${{ inputs.tag || github.ref }}
  # Version shown by the installers.
  RELEASE_NAME: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '0.0.0-preview' }}

jobs:
  runner:
    name: Runner (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      SIGNING: ${{ github.event_name != 'pull_request' && secrets.MACOS_CERT_P12 != '' }}
      WIN_SIGNING: ${{ github.event_name != 'pull_request' && secrets.AZURE_CLIENT_SECRET != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: paperclip-runnerd-windows-x64.exe, exe: paperclip-runnerd.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: paperclip-runnerd-macos-arm64, exe: paperclip-runnerd }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: paperclip-runnerd-macos-x64, exe: paperclip-runnerd }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.BUILD_REF }}

      - name: Install the runner's pinned Rust toolchain
        working-directory: packages/paperclip-runner
        run: |
          rustup toolchain install || rustup show
          toolchain="$(rustup show active-toolchain | awk '{print $1}')"
          rustup target add --toolchain "$toolchain" "${{ matrix.target }}"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Runner Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: runner-binaries-${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Build paperclip-runnerd
        run: |
          cargo build --release --locked --manifest-path packages/paperclip-runner/runner/Cargo.toml \
            -p paperclip-runner-core --bin paperclip-runnerd --target "${{ matrix.target }}"
          mkdir -p out
          cp "packages/paperclip-runner/runner/target/${{ matrix.target }}/release/${{ matrix.exe }}" "out/${{ matrix.asset }}"

      # Installs download this file with curl, so Gatekeeper never checks it; the signature is
      # there so macOS and security tools can tell whose binary it is. Not under the hardened
      # runtime and not notarised.
      - name: Sign the Mac binary with the Developer ID
        if: runner.os == 'macOS' && env.SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/gsam-signing.keychain-db"
          id=$(bash scripts/release/macos-signing-keychain.sh "$keychain")
          codesign --force --timestamp --keychain "$keychain" --sign "$id" "out/${{ matrix.asset }}"
          codesign --verify --strict --verbose=2 "out/${{ matrix.asset }}"
          security delete-keychain "$keychain"

      - name: Sign the Windows binary through Azure Artifact Signing
        if: runner.os == 'Windows' && env.WIN_SIGNING == 'true'
        shell: powershell
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release\windows-signing.ps1 "out\${{ matrix.asset }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $sig = Get-AuthenticodeSignature "out\${{ matrix.asset }}"
          if ($sig.Status -ne "Valid") { throw "The runner binary's signature is $($sig.Status)." }

      - name: Keep the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          retention-days: 14

  mac-installer:
    name: Mac installer (GSAM-Installer.dmg)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SIGNING: ${{ github.event_name != 'pull_request' && secrets.MACOS_CERT_P12 != '' }}
      NOTARISING: ${{ github.event_name != 'pull_request' && secrets.MACOS_CERT_P12 != '' && secrets.MACOS_NOTARY_KEY_P8 != '' }}
    outputs:
      notarised: ${{ steps.build.outputs.notarised }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.BUILD_REF }}

      - name: Developer ID certificate into a throwaway keychain
        if: env.SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/gsam-signing.keychain-db"
          id=$(bash scripts/release/macos-signing-keychain.sh "$keychain")
          echo "GSAM_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
          echo "GSAM_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: App Store Connect key for notarising
        if: env.NOTARISING == 'true'
        env:
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/gsam-notary-key.p8"
          (umask 077; printf '%s' "$MACOS_NOTARY_KEY_P8" | base64 --decode > "$key")
          echo "GSAM_NOTARY_KEY=$key" >> "$GITHUB_ENV"
          echo "GSAM_NOTARY_KEY_ID=$MACOS_NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "GSAM_NOTARY_ISSUER=$MACOS_NOTARY_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Build GSAM-Installer.dmg
        id: build
        env:
          GSAM_HUB_URL: ${{ vars.GSAM_HUB_URL }}
        run: |
          if [ "$SIGNING" != true ] && [ "${{ github.event_name }}" != pull_request ]; then
            echo "::warning title=Not signed by Greatstone::The Developer ID secrets are unset, so this GSAM-Installer.dmg is ad hoc signed: the first open needs right-click, Open."
          fi
          if [ -z "$GSAM_HUB_URL" ]; then
            echo "::warning title=No hub address::The repository variable GSAM_HUB_URL is unset, so this GSAM-Installer.dmg cannot activate a licence. Set it and run again."
          fi
          bash packaging/macos/build.sh
          lipo -archs packaging/macos/dist/GSAM.app/Contents/MacOS/applet
          codesign --verify --deep packaging/macos/dist/GSAM.app
          hdiutil verify packaging/macos/dist/GSAM-Installer.dmg
          if [ "$NOTARISING" = true ]; then
            # What a customer's Mac does on first open: Gatekeeper must accept both.
            spctl --assess --type open --context context:primary-signature -vv packaging/macos/dist/GSAM-Installer.dmg
            spctl --assess --type execute -vv packaging/macos/dist/GSAM.app
            echo "notarised=true" >> "$GITHUB_OUTPUT"
          fi
          ls -la packaging/macos/dist

      - name: Remove the keychain and the key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/gsam-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/gsam-notary-key.p8"

      - name: Screenshots of the mounted window (Light and Dark Mode)
        continue-on-error: true
        run: bash scripts/release/dmg-window-shots.sh packaging/macos/dist/GSAM-Installer.dmg shots

      - name: Keep the disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GSAM-Installer.dmg
          path: packaging/macos/dist/GSAM-Installer.dmg
          retention-days: 14

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-screenshots-mac
          path: shots/
          retention-days: 14
          if-no-files-found: warn

  windows-installer:
    name: Windows installer (GSAM-Setup.exe)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WIN_SIGNING: ${{ github.event_name != 'pull_request' && secrets.AZURE_CLIENT_SECRET != '' }}
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.BUILD_REF }}

      - name: Install Inno Setup when the image has none
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # Sets GSAM_SIGN_COMMAND for the build below.
      - name: Get signing ready
        if: env.WIN_SIGNING == 'true' || github.event_name == 'pull_request'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          if ($env:WIN_SIGNING -eq "true") {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release\windows-signing.ps1
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release\windows-signing.ps1 -SelfSigned
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build GSAM-Setup.exe
        id: build
        env:
          GSAM_HUB_URL: ${{ vars.GSAM_HUB_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if (-not $env:GSAM_HUB_URL) {
            Write-Output "::warning title=No hub address::The repository variable GSAM_HUB_URL is unset, so this GSAM-Setup.exe cannot activate a licence. Set it and run again."
          }
          $env:GSAM_INSTALLER_VERSION = $env:RELEASE_NAME
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem packaging\windows\dist
          $sig = Get-AuthenticodeSignature packaging\windows\dist\GSAM-Setup.exe
          Write-Output "Signature: $($sig.Status), $($sig.SignerCertificate.Subject)"
          if ($env:GSAM_SIGN_COMMAND -and -not $sig.SignerCertificate) { throw "GSAM-Setup.exe was meant to be signed and is not." }
          if ($env:WIN_SIGNING -eq "true") {
            if ($sig.Status -ne "Valid") { throw "GSAM-Setup.exe's signature is $($sig.Status)." }
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Screenshots of the wizard pages
        continue-on-error: true
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release\inno-wizard-shots.ps1 -Setup packaging\windows\dist\GSAM-Setup.exe -Out shots

      - name: Keep the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GSAM-Setup.exe
          path: packaging/windows/dist/GSAM-Setup.exe
          retention-days: 14

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-screenshots-windows
          path: shots/
          retention-days: 14
          if-no-files-found: warn

  publish:
    name: Publish to the release
    needs: [runner, mac-installer, windows-installer]
    if: github.event_name != 'pull_request' && startsWith(inputs.tag || github.ref_name, 'live-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Collect the files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          pattern: "{paperclip-runnerd-*,GSAM-Installer.dmg,GSAM-Setup.exe}"
          merge-multiple: true

      - name: SHA256SUMS and the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          MAC_NOTARISED: ${{ needs.mac-installer.outputs.notarised }}
          WIN_SIGNED: ${{ needs.windows-installer.outputs.signed }}
        run: |
          cd out
          ls -la
          sha256sum paperclip-runnerd-* GSAM-Installer.dmg GSAM-Setup.exe > SHA256SUMS
          cat SHA256SUMS
          # Latest only when this is the newest live-* tag (a back-fill of an older one is not).
          newest=$(git ls-remote --tags --refs "https://github.com/$GH_REPO.git" 'live-*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          latest=$([ "$newest" = "$TAG" ] && echo true || echo false)
          mac_note="Mac, Apple silicon and Intel: the first time, right-click GSAM in Applications and choose Open"
          [ "$MAC_NOTARISED" != true ] || mac_note="Mac, Apple silicon and Intel, signed by Greatstone and checked by Apple"
          win_note="Windows 10 and 11: if Windows says it protected your PC, choose More info, then Run anyway"
          [ "$WIN_SIGNED" != true ] || win_note="Windows 10 and 11, signed by Greatstone"
          if gh release view "$TAG" >/dev/null 2>&1; then
            [ "$latest" = false ] || gh release edit "$TAG" --latest
          else
            gh release create "$TAG" --verify-tag --latest="$latest" --title "GSAM $TAG" \
              --notes "GSAM release $TAG. GSAM-Installer.dmg ($mac_note) and GSAM-Setup.exe ($win_note). Installs download the runner binaries below. Check any file against SHA256SUMS."
          fi
          gh release upload "$TAG" paperclip-runnerd-* GSAM-Installer.dmg GSAM-Setup.exe SHA256SUMS --clobber
