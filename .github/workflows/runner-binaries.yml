# Prebuilt native runner (paperclip-runnerd) for every live release, so a
# customer's install never needs Rust or a C toolchain (on Windows that would
# be Microsoft's build tools, a 2 GB download that needs an administrator).
#
#   build    paperclip-runnerd for Windows x64 (MSVC), macOS arm64 and macOS
#            x64 (cross-built on the Apple silicon runner), with the pinned
#            toolchain and the locked dependencies
#   publish  on a live-* tag only: the binaries and SHA256SUMS on that tag's
#            GitHub release (made if missing, never marked latest)
#
# Installs download them with scripts/fetch-runner-binary.mjs, which checks
# SHA256SUMS. Pull requests that touch the runner only build, as proof. A run
# by hand with a tag (re)publishes that tag's binaries, for a live tag made
# before this workflow existed.
#
# Plan: doc/plans/2026-11-25-gsam-for-windows.md (W3). No secrets; publish
# alone gets contents: write, to attach release files.

name: Runner binaries

on:
  push:
    tags: ["live-*"]
  pull_request:
    paths:
      - ".github/workflows/runner-binaries.yml"
      - "packages/paperclip-runner/runner/**"
      - "packages/paperclip-runner/rust-toolchain.toml"
      - "scripts/fetch-runner-binary.mjs"
  workflow_dispatch:
    inputs:
      tag:
        description: "A live-* tag to build and publish (empty: build the branch, publish nothing)"
        required: false

permissions:
  contents: read

concurrency:
  group: runner-binaries-${{ github.event.pull_request.number || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: paperclip-runnerd-windows-x64.exe, exe: paperclip-runnerd.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: paperclip-runnerd-macos-arm64, exe: paperclip-runnerd }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: paperclip-runnerd-macos-x64, exe: paperclip-runnerd }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the runner's pinned Rust toolchain
        working-directory: packages/paperclip-runner
        run: |
          rustup toolchain install || rustup show
          toolchain="$(rustup show active-toolchain | awk '{print $1}')"
          rustup target add --toolchain "$toolchain" "${{ matrix.target }}"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Runner Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: runner-binaries-${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Build paperclip-runnerd
        run: |
          cargo build --release --locked --manifest-path packages/paperclip-runner/runner/Cargo.toml \
            -p paperclip-runner-core --bin paperclip-runnerd --target "${{ matrix.target }}"
          mkdir -p out
          cp "packages/paperclip-runner/runner/target/${{ matrix.target }}/release/${{ matrix.exe }}" "out/${{ matrix.asset }}"

      - name: Keep the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          retention-days: 14

  publish:
    name: Publish to the release
    needs: build
    if: startsWith(inputs.tag || github.ref_name, 'live-') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Collect the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true

      - name: SHA256SUMS and the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd out
          sha256sum paperclip-runnerd-* > SHA256SUMS
          cat SHA256SUMS
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --latest=false \
            --title "GSAM $TAG" --notes "GSAM release $TAG. Installs use the prebuilt runner binaries below (checked against SHA256SUMS)."
          gh release upload "$TAG" paperclip-runnerd-* SHA256SUMS --clobber
