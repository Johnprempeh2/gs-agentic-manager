# Fork CI for GS Agentic Manager (Johnprempeh2/gs-agentic-manager, public).
#
# The only workflow this fork runs. Upstream's CI, release, image, Storybook
# and eval workflows were deleted rather than adapted: they publish to
# upstream's npm scope and container registry, route to upstream's AWS runner
# fleets and call upstream's trusted PR workflow by reference, so on a fork
# they either fail or act on infrastructure we do not own.
# scripts/check-fork-workflows.mjs keeps it that way after upstream merges.
#
#   guard      the rebrand is complete, no upstream workflow came back and the
#              ui token gates pass
#   typecheck  pnpm typecheck: every workspace, including the runner's
#              cargo fmt --check and cargo check
#   build      pnpm build: every workspace, including the runner's release
#              binary built with cargo
#   runner     the runner's Rust tests (the rebrand edits Rust sources)
#   server-security  the server's authz, cross-company and route contract
#              tests (16 files, about 5 minutes), on every run
#   journeys   the core journeys end to end in Chromium (tests/e2e/core-journeys, overnight-features and smoke-pages specs)
#   test       the full vitest suite through scripts/run-vitest-stable.mjs,
#              sharded across 13 runners (the server suites run one file at a
#              time): the same lanes as the PC's release test gate
#              (scripts/greatstone-test-gate.lanes), on every pull request,
#              every push to main and by hand. It is the release gate:
#              scripts/greatstone-github-gate.mjs lets a commit go live only
#              when this run is green for it (or for the pull request run that
#              tested the same files)
#   Fork CI    a single result to require in branch protection
#
# Triggers: pull requests, pushes to main, and manual runs. Since the
# repository went public, standard GitHub-hosted runners cost no Actions
# minutes, so every pull request runs the whole test matrix (about 13 minutes
# wall clock, 18 Oct 2026) instead of only the fast lanes: failing tests are
# stopped at the pull request, not at the release gate. The matrix was manual
# only while the repository was private, to save the allowance. A new push to
# a pull request cancels its older run (the concurrency group below). The
# runner's Rust tests stay manual. Every push to main gets the full matrix too
# (main runs are never cancelled), so each merge is tested on its exact commit.
# The PC's test gate (scripts/greatstone-test-gate.sh) is only the fallback
# when GitHub cannot be asked.
#
# No secrets, a read-only token, GitHub-hosted runners only.

name: Fork CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One group per pull request (a newer push cancels the older run), and one
# per main commit: a group keeps only one waiting run, so a shared main group
# would drop the runs of merges that land close together.
concurrency:
  group: fork-ci-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guard:
    name: Rebrand and workflow guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Nothing left to rebrand
        run: node scripts/greatstone-rebrand.mjs --check

      - name: No em or en dashes in user-facing copy
        run: node scripts/check-no-dashes.mjs

      - name: Every company page route is registered
        run: node scripts/check-company-routes.mjs

      - name: Every test named in the release switch-test map exists
        run: node scripts/check-switch-tests-map.mjs

      # DESIGN.md: ui colours, sizes and date formats come from the token layer.
      - name: UI token gates
        run: npm run --silent check:token-gates

      - name: Only fork-owned workflows
        run: node scripts/check-fork-workflows.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/fork-setup
        with:
          rust: "true"

      - name: Restore runner Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: fork-runner
          save-if: "false"

      - name: Typecheck every workspace
        run: pnpm typecheck

      # The full suite only runs on the PC release gate; this one test is cheap
      # and catches the commonest miss (a new route not added to the API
      # document), which otherwise only fails at release time.
      - name: Every mounted route is in the API document
        run: pnpm --filter @greatstone/server exec vitest run src/__tests__/openapi-routes.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/fork-setup
        with:
          rust: "true"
          save-pnpm-store: "true"

      # The one writer of the Rust cache, and only from branch pushes, so a
      # pull request from another repository cannot seed it.
      - name: Runner Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: fork-runner
          save-if: ${{ github.event_name == 'push' }}

      - name: Build every workspace
        run: pnpm build

  runner:
    name: Runner Rust tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/fork-setup
        with:
          rust: "true"

      - name: Restore runner Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: fork-runner
          save-if: "false"

      # cargo fmt --check, cargo check, the workspace tests in release mode and
      # the conformance and replay parity checks.
      - name: Runner Rust checks and tests
        run: pnpm --filter @greatstone/paperclip-runner run check:runner

  # The server's company boundary and route contract tests, by file name: every
  # authz, cross-company and cross-tenant suite, the upload type rules and the
  # API document. A new route with no company boundary test fails here, on the
  # pull request that adds it. The rest of the server suite stays manual.
  server-security:
    name: Tests (server security)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/fork-setup

      - name: Run the server security tests
        run: |
          pnpm run preflight:workspace-links
          pnpm --filter @greatstone/plugin-sdk ensure-build-deps
          cd server && npx vitest run authz cross-company cross-tenant attachment-types openapi-routes

  # Dashboard, new task, Needs you, a client, Inbox and Blocked, and the theme
  # switch, through the built UI against a throwaway local_trusted instance.
  journeys:
    name: Core journeys (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/fork-setup

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the core journeys
        run: pnpm test:e2e core-journeys.spec.ts overnight-features.spec.ts smoke-pages.spec.ts

      - name: Keep the report when a journey fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-journeys-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

  test:
    name: Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Shard counts keep the whole run under a free account's 20 concurrent
      # jobs. The server groups are split by the durations recorded in
      # scripts/general-server-shard-durations.json and
      # scripts/serialized-shard-durations.json, so any count balances.
      # One server shard also builds the runner with cargo (the native runner
      # suite), which is why the server shards get the Rust toolchain.
      matrix:
        include:
          - { label: "server 1/6", mode: general, group: general-server-without-chat, shard_index: 0, shard_count: 6, rust: true }
          - { label: "server 2/6", mode: general, group: general-server-without-chat, shard_index: 1, shard_count: 6, rust: true }
          - { label: "server 3/6", mode: general, group: general-server-without-chat, shard_index: 2, shard_count: 6, rust: true }
          - { label: "server 4/6", mode: general, group: general-server-without-chat, shard_index: 3, shard_count: 6, rust: true }
          - { label: "server 5/6", mode: general, group: general-server-without-chat, shard_index: 4, shard_count: 6, rust: true }
          - { label: "server 6/6", mode: general, group: general-server-without-chat, shard_index: 5, shard_count: 6, rust: true }
          - { label: "server chat", mode: general, group: general-chat }
          - { label: "ui and cli", mode: general, group: general-workspaces-a }
          - { label: "packages", mode: general, group: general-workspaces-b }
          - { label: "serialized 1/4", mode: serialized, shard_index: 0, shard_count: 4 }
          - { label: "serialized 2/4", mode: serialized, shard_index: 1, shard_count: 4 }
          - { label: "serialized 3/4", mode: serialized, shard_index: 2, shard_count: 4 }
          - { label: "serialized 4/4", mode: serialized, shard_index: 3, shard_count: 4 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/fork-setup
        with:
          rust: ${{ matrix.rust && 'true' || 'false' }}

      # The native runner suite builds the runner with cargo; reuse the build
      # cache the Build job writes from main.
      - name: Restore runner Rust build cache
        if: matrix.rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: fork-runner
          save-if: "false"

      - name: Run vitest (${{ matrix.label }})
        env:
          MODE: ${{ matrix.mode }}
          GROUP: ${{ matrix.group }}
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          args=()
          if [ -n "$GROUP" ]; then args+=(--group "$GROUP"); fi
          if [ -n "$SHARD_COUNT" ]; then args+=(--shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT"); fi
          pnpm "test:run:$MODE" -- "${args[@]}"

  result:
    name: Fork CI
    if: always()
    needs: [guard, typecheck, build, server-security, journeys, runner, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every lane passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Lanes that only run by hand report "skipped" on pull requests and main.
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
