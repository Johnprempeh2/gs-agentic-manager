name: Secret history scan

# One-time gitleaks scan of the full history (GRE-6509, step 1 of GRE-6164).
# Manual runs only, so it costs nothing after the scan.
# The repo is public: the log and the artifact are readable by anyone. gitleaks
# runs with --redact, and only rule, file, line, commit, date and author leave
# the runner. Secret, Match, Line and commit Message are dropped before upload.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums.txt.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth 0 brings every branch and tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Heads of every pull request, so commits on deleted PR branches are covered.
      - name: Fetch pull request refs
        run: |
          git fetch --no-tags --quiet origin '+refs/pull/*/head:refs/remotes/pull/*'
          echo "branches: $(git branch -r | grep -vc '^ *pull/')"
          echo "tags: $(git tag | wc -l)"
          echo "pull request heads: $(git for-each-ref refs/remotes/pull | wc -l)"
          echo "commits: $(git rev-list --all | wc -l)"

      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # --exit-code 0: findings are the result, not a failure. No --verbose, so
      # findings are not printed by gitleaks itself.
      - name: Scan all history
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --log-opts="--all" \
            --redact \
            --no-banner \
            --exit-code 0 \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-raw.json"

      - name: Strip report to safe fields
        run: |
          jq -s '(.[0] // []) | [.[] | {RuleID, Description, File, StartLine, Commit, Date, Author, Fingerprint}]' \
            "$RUNNER_TEMP/gitleaks-raw.json" > gitleaks-findings.json
          rm "$RUNNER_TEMP/gitleaks-raw.json"
          count=$(jq length gitleaks-findings.json)
          echo "findings: $count"
          jq -r '.[] | [.RuleID, .File, (.StartLine | tostring), .Commit[0:12], .Date, .Author] | @tsv' \
            gitleaks-findings.json | sort
          {
            echo "### gitleaks: $count findings"
            echo
            echo "| rule | count |"
            echo "| --- | --- |"
            jq -r 'group_by(.RuleID) | .[] | "| \(.[0].RuleID) | \(length) |"' gitleaks-findings.json
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-findings
          path: gitleaks-findings.json
          retention-days: 1
          if-no-files-found: error
