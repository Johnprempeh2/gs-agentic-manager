# Windows CI for GS Agentic Manager: proves GSAM runs natively on Windows
# (no WSL, no Docker), the way a Windows customer's copy will run it.
#
#   windows  on windows-latest: the same setup as Fork CI (Node from .nvmrc,
#            pnpm, a frozen-lockfile install), the native runner built with
#            cargo (MSVC from the runner image), the install smoke test
#            (scripts/native-install-smoke.mjs: `pnpm dev:once --data-dir`,
#            health, a company and an agent through the API, stop, restart on
#            the same data, stop), then the Windows-sensitive unit tests: paths,
#            processes, the dev runner, the adapters and the runner's own tests.
#
# Plan and status: doc/plans/2026-11-25-gsam-for-windows.md.
#
# Triggers: pull requests that touch code the Windows build runs, and manual
# runs. No secrets, a read-only token, GitHub-hosted runners only.

name: Windows CI

on:
  pull_request:
    paths:
      - ".github/workflows/windows-ci.yml"
      - ".github/actions/**"
      - ".gitattributes"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "cli/**"
      - "packages/**"
      - "scripts/**"
      - "server/src/**"
      - "server/package.json"
      - "ui/package.json"
      - "ui/vite.config.ts"
      - "packaging/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (native)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/fork-setup
        with:
          rust: "true"
          save-pnpm-store: "true"

      - name: Runner Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: windows-runner

      # The same binary `pnpm dev:once` would build on first start, built up
      # front so its errors show here, not inside the smoke test.
      - name: Build the native runner (paperclip-runnerd.exe)
        run: pnpm --filter @greatstone/paperclip-runner run build:binary

      # As a standard user, as a customer's copy runs: PostgreSQL refuses to
      # start with administrator rights, and the runner's own account is an
      # elevated administrator (scripts/windows/run-as-standard-user.ps1).
      - name: Install smoke test as a standard user (start, API, stop, restart)
        shell: powershell
        run: |
          $node = (Get-Command node).Source
          & scripts/windows/run-as-standard-user.ps1 -Name smoke -Command """$node"" scripts\native-install-smoke.mjs --port 3197"
          exit $LASTEXITCODE

      # Standard users cannot make file symlinks without Developer Mode or the
      # symlink privilege, which the Codex managed home uses. Make sure this PC
      # is like a customer's (Developer Mode off), show what the standard user
      # may do, then run the Codex home tests as that user.
      - name: Developer Mode off, as on a customer's PC
        shell: powershell
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          Write-Output ("Developer Mode before: " + (Get-ItemProperty $key -ErrorAction SilentlyContinue).AllowDevelopmentWithoutDevLicense)
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
          Set-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -Value 0 -Type DWord
          & scripts/windows/run-as-standard-user.ps1 -Name whoami -TimeoutMinutes 2 -Command "whoami /groups /priv"
          exit $LASTEXITCODE

      - name: Codex home tests as a standard user
        shell: powershell
        run: |
          & scripts/windows/run-as-standard-user.ps1 -Name codex-home -TimeoutMinutes 15 -Command "set ""GSAM_EXPECT_NO_SYMLINKS=1"" && npx vitest run packages/adapters/codex-local/src/server/codex-home-windows.test.ts"
          exit $LASTEXITCODE

      - name: Unit tests (paths, processes, dev runner)
        run: |
          node --test scripts/fetch-runner-binary.test.mjs
          pnpm run preflight:workspace-links
          pnpm --filter @greatstone/plugin-sdk ensure-build-deps
          pnpm --filter @greatstone/shared exec vitest run src/home-paths.test.ts
          pnpm --filter gsam exec vitest run src/__tests__/home-paths.test.ts src/__tests__/process-group.test.ts
          pnpm --filter @greatstone/server exec vitest run \
            src/__tests__/dev-runner-native-binary.test.ts \
            src/__tests__/dev-runner-options.test.ts \
            src/__tests__/dev-runner-paths.test.ts \
            src/__tests__/dev-runner-process.test.ts \
            src/__tests__/local-service-supervisor.test.ts

      # From the repository root: adapter-utils has no vitest config of its own.
      - name: Unit tests (adapters)
        run: |
          npx vitest run \
            packages/adapter-utils/src/server-utils.test.ts \
            packages/adapter-utils/src/server-utils-env.test.ts \
            packages/adapter-utils/src/process-kill-guard.test.ts \
            packages/adapter-utils/src/process-kill-guard-windows.test.ts \
            packages/adapter-utils/src/child-output-capture.test.ts \
            packages/adapter-utils/src/acpx-engine/spawn-smoke.test.ts \
            packages/adapters/claude-local/src/server/claude-config.test.ts \
            packages/adapters/claude-local/src/server/probe-env.test.ts \
            packages/adapters/claude-local/src/server/parse.test.ts \
            packages/adapters/codex-local/src/server/codex-home.test.ts \
            packages/adapters/codex-local/src/server/codex-args.test.ts

      - name: Runner Rust tests (conformance and replay parity)
        run: |
          pnpm --filter @greatstone/paperclip-runner run check:conformance-parity
          pnpm --filter @greatstone/paperclip-runner run check:replay-parity

  installer:
    name: Windows installer (build and install as a standard user)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The PowerShell scripts parse
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem packaging\windows\src\*.ps1, packaging\windows\*.ps1, scripts\windows\*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Output "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          exit $bad

      - name: Setup
        uses: ./.github/actions/fork-setup
        with:
          rust: "true"

      - name: Runner Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: windows-runner
          save-if: "false"

      # Stands in for the release's prebuilt binary (W3), which a test build has none of.
      - name: Build the native runner
        run: pnpm --filter @greatstone/paperclip-runner run build:binary

      - name: Install Inno Setup when the image has none
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # A sandbox build: its hub is the test hub on 127.0.0.1:3491. Never hand it out.
      - name: Build GSAM-Setup.exe
        shell: powershell
        env:
          GSAM_HUB_URL: http://127.0.0.1:3491
          GSAM_INSTALLER_VERSION: 0.0.0-ci
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build.ps1

      - name: Keep the sandbox installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GSAM-Setup-sandbox-hub-do-not-distribute
          path: packaging/windows/dist/
          retention-days: 7

      - name: Install, check and uninstall as a standard user
        shell: powershell
        run: |
          # As on a customer's PC: Developer Mode off.
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
          Set-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -Value 0 -Type DWord
          git branch -f gsam-installer-smoke HEAD
          $installer = Resolve-Path packaging\windows\dist\GSAM-Setup.exe
          $runner = Resolve-Path packages\paperclip-runner\dist\bin\paperclip-runnerd.exe
          & scripts/windows/run-as-standard-user.ps1 -Name installer -TimeoutMinutes 90 `
            -Command "powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\installer-smoke.ps1 -Installer ""$installer"" -RunnerBinary ""$runner"" -CodeRef gsam-installer-smoke"
          exit $LASTEXITCODE


      - name: Keep the installer logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-logs
          path: installer-logs/
          retention-days: 7
          if-no-files-found: ignore
