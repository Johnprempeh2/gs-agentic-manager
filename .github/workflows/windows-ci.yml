# Windows CI for GS Agentic Manager: proves GSAM runs natively on Windows
# (no WSL, no Docker), the way a Windows customer's copy will run it.
#
#   windows  on windows-latest: the same setup as Fork CI (Node from .nvmrc,
#            pnpm, a frozen-lockfile install), the native runner built with
#            cargo (MSVC from the runner image), the install smoke test
#            (scripts/native-install-smoke.mjs: `pnpm dev:once --data-dir`,
#            health, a company and an agent through the API, stop, restart on
#            the same data, stop), then the Windows-sensitive unit tests: paths,
#            processes, the dev runner, the adapters and the runner's own tests.
#
# Plan and status: doc/plans/2026-11-25-gsam-for-windows.md.
#
# Triggers: pull requests that touch code the Windows build runs, and manual
# runs. No secrets, a read-only token, GitHub-hosted runners only.

name: Windows CI

on:
  pull_request:
    paths:
      - ".github/workflows/windows-ci.yml"
      - ".github/actions/**"
      - ".gitattributes"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "cli/**"
      - "packages/**"
      - "scripts/**"
      - "server/src/**"
      - "server/package.json"
      - "ui/package.json"
      - "ui/vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (native)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/fork-setup
        with:
          rust: "true"
          save-pnpm-store: "true"

      - name: Runner Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: windows-runner

      # The same binary `pnpm dev:once` would build on first start, built up
      # front so its errors show here, not inside the smoke test.
      - name: Build the native runner (paperclip-runnerd.exe)
        run: pnpm --filter @greatstone/paperclip-runner run build:binary

      # As a standard user, as a customer's copy runs: PostgreSQL refuses to
      # start with administrator rights, and the runner's own account is an
      # elevated administrator (scripts/windows/run-as-standard-user.ps1).
      - name: Install smoke test as a standard user (start, API, stop, restart)
        shell: powershell
        run: |
          $node = (Get-Command node).Source
          & scripts/windows/run-as-standard-user.ps1 -Name smoke -Command """$node"" scripts\native-install-smoke.mjs --port 3197"
          exit $LASTEXITCODE

      # Standard users cannot make file symlinks without Developer Mode, which
      # the Codex managed home uses: run its tests as one.
      - name: Codex home tests as a standard user
        shell: powershell
        run: |
          & scripts/windows/run-as-standard-user.ps1 -Name codex-home -TimeoutMinutes 15 -Command "npx vitest run packages/adapters/codex-local/src/server/codex-home.test.ts"
          exit $LASTEXITCODE

      - name: Unit tests (paths, processes, dev runner)
        run: |
          pnpm run preflight:workspace-links
          pnpm --filter @greatstone/plugin-sdk ensure-build-deps
          pnpm --filter @greatstone/shared exec vitest run src/home-paths.test.ts
          pnpm --filter gsam exec vitest run src/__tests__/home-paths.test.ts src/__tests__/process-group.test.ts
          pnpm --filter @greatstone/server exec vitest run \
            src/__tests__/dev-runner-native-binary.test.ts \
            src/__tests__/dev-runner-options.test.ts \
            src/__tests__/dev-runner-paths.test.ts \
            src/__tests__/dev-runner-process.test.ts \
            src/__tests__/local-service-supervisor.test.ts

      # From the repository root: adapter-utils has no vitest config of its own.
      - name: Unit tests (adapters)
        run: |
          npx vitest run \
            packages/adapter-utils/src/server-utils.test.ts \
            packages/adapter-utils/src/server-utils-env.test.ts \
            packages/adapter-utils/src/process-kill-guard.test.ts \
            packages/adapter-utils/src/process-kill-guard-windows.test.ts \
            packages/adapter-utils/src/child-output-capture.test.ts \
            packages/adapter-utils/src/acpx-engine/spawn-smoke.test.ts \
            packages/adapters/claude-local/src/server/claude-config.test.ts \
            packages/adapters/claude-local/src/server/probe-env.test.ts \
            packages/adapters/claude-local/src/server/parse.test.ts \
            packages/adapters/codex-local/src/server/codex-home.test.ts \
            packages/adapters/codex-local/src/server/codex-args.test.ts

      - name: Runner Rust tests (conformance and replay parity)
        run: |
          pnpm --filter @greatstone/paperclip-runner run check:conformance-parity
          pnpm --filter @greatstone/paperclip-runner run check:replay-parity
