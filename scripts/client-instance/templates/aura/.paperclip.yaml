schema: paperclip/v1
schemaVersion: 7
company:
  # John offers to hire; the owner approves each new agent.
  requireBoardApprovalForNewAgents: true
agents:
  john:
    role: ceo
    adapter:
      # Runs on the owner's own linked Claude subscription. Sonnet is on every
      # paid Claude plan; never pin a Fable model here.
      type: claude_local
      config:
        model: claude-sonnet-5
    permissions:
      canCreateAgents: true
    permissionGrants:
      - permissionKey: intelligence:write
routines:
  daily-intelligence-pulse:
    status: paused
    triggers:
      - kind: schedule
        label: Every day at 07:00
        cronExpression: "0 7 * * *"
        timezone: Africa/Accra
